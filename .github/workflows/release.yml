name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs dependency build scripts and tests, so it gets no write access.
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match Cargo.toml version $version" }

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  # Runs no project code; only attests the built zip and publishes it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "AvrcpKeeper $version" > notes.md
          printf '\nVerify the download with `gh attestation verify %s -R %s`.\n' \
            "$(basename dist/*.zip)" "$GITHUB_REPOSITORY" >> notes.md

      # Draft first with the files attached, then publish. This also works with immutable releases.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "AvrcpKeeper ${TAG#v}" --notes-file notes.md --draft --verify-tag
          gh release edit "$TAG" --draft=false --latest
